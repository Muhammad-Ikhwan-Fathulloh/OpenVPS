<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenVPS — Unified Dashboard</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #0b0d12;
      color: #f8f9fa;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .card {
      background-color: #161922;
      border-color: #232839;
    }

    .card-header {
      background-color: #1a1e28;
      border-bottom: 1px solid #232839;
      font-weight: 600;
    }

    .nav-tabs .nav-link {
      color: #94a3b8;
      border: none;
      padding: 12px 20px;
    }

    .nav-tabs .nav-link.active {
      background-color: transparent;
      border-bottom: 3px solid #06b6d4;
      color: #06b6d4;
      font-weight: 600;
    }

    .nav-tabs {
      border-bottom: 1px solid #232839;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #232839;
    }

    .canvas-container video,
    .canvas-container canvas,
    .canvas-container #three-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .canvas-container .hud-overlay {
      pointer-events: none;
      z-index: 10;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 8px;
    }

    .thumb {
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid #2a3040;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb .rm-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(220, 53, 69, 0.8);
      border: none;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 10px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }

    .status-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      z-index: 20;
      color: #06b6d4;
    }

    .scrubber-bar {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary mb-4 px-3"
    style="background-color: #11141c !important;">
    <span class="navbar-brand mb-0 h1 text-info fw-bold">📷 OpenVPS Dashboard</span>
    <div class="d-flex w-auto gap-3 align-items-center">
      <a href="/replay" class="btn btn-sm btn-outline-info text-info fw-bold" style="text-decoration:none;">🎬 Replay</a>
      <input type="text" id="serverUrl" class="form-control form-control-sm bg-dark text-light border-secondary"
        value="http://localhost:8000" style="width: 200px;" placeholder="Server URL">
      <input type="text" id="apiKey" class="form-control form-control-sm bg-dark text-light border-secondary"
        style="width: 150px;" placeholder="API Key (Opsional)">
    </div>
  </nav>

  <div class="container-fluid px-4 pb-5">
    <!-- TABS -->
    <ul class="nav nav-tabs mb-4" id="appTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="capture-tab" data-bs-toggle="tab" data-bs-target="#capture" type="button"
          role="tab">📹 Capture & Detect</button>
      </li>
    </ul>

    <div class="tab-content" id="appTabsContent">
      <!-- ==================== CAPTURE TAB ==================== -->
      <div class="tab-pane fade show active" id="capture" role="tabpanel">
        <div class="row g-4">

          <div class="col-lg-8">
            <div class="card h-100">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span>Kamera Utama</span>
                <span id="camStatus" class="badge bg-secondary">Mati</span>
              </div>
              <div class="card-body">
                <div class="canvas-container mb-3">
                  <video id="videoElement" autoplay playsinline muted></video>
                  <canvas id="overlayCanvas" class="hud-overlay"></canvas>
                  <div class="status-badge" id="recIndicator" style="display:none; color: #ef4444;">⏺ REC: <span
                      id="recFrameCount">0</span> frame</div>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                  <button class="btn btn-primary" id="startCamBtn">▶ Nyalakan Kamera</button>
                  <button class="btn btn-secondary" id="flipCamBtn" disabled>🔄 Balik Kamera</button>
                  <button class="btn btn-info text-white fw-bold" id="captureBtn" disabled>📸 Capture Foto</button>
                  <button class="btn btn-warning fw-bold ms-auto" id="testLocBtn" disabled>📍 Tes Localize VPS</button>
                </div>

                <div class="mt-4 pt-3 border-top border-secondary">
                  <h6 class="text-secondary fw-bold text-uppercase mb-3">Kontrol Deteksi & Rekaman</h6>
                  <div class="d-flex gap-3 align-items-center flex-wrap">
                    <div class="form-check form-switch fs-5">
                      <input class="form-check-input" type="checkbox" role="switch" id="toggleDetect" disabled>
                      <label class="form-check-label fs-6 ms-1" for="toggleDetect">Live Detect YOLO</label>
                    </div>
                    <div class="form-check form-switch fs-5">
                      <input class="form-check-input" type="checkbox" role="switch" id="toggleRecord" disabled>
                      <label class="form-check-label fs-6 ms-1 text-danger" for="toggleRecord">Mulai Rekam Sesi</label>
                    </div>
                  </div>
                  <div id="sysLog" class="small text-info mt-2">Menunggu instruksi...</div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card mb-4" id="galleryCard">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span>Galeri Snapshot</span>
                <span class="badge bg-dark" id="galCount">0</span>
              </div>
              <div class="card-body">
                <div class="gallery-grid mb-3" id="galleryGrid"></div>
                <div class="d-flex gap-2">
                  <button class="btn btn-success btn-sm flex-grow-1" id="uploadFilesBtn" disabled>Kirim ke
                    Server</button>
                  <button class="btn btn-secondary btn-sm" id="downloadZipBtn" disabled>ZIP</button>
                  <button class="btn btn-danger btn-sm" id="clearGalleryBtn" disabled>Bersihkan</button>
                </div>
              </div>
            </div>

            <div class="card" id="localizeResultCard">
              <div class="card-header">Hasil VPS Localize</div>
              <div class="card-body p-2" id="localizeResArea">
                <div class="text-center text-muted p-4 small">Tekan "Tes Localize VPS" untuk melihat hasil 6DoF di sini.
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // --- GLOBAL ---
    const getHeaders = () => {
      const v = document.getElementById('apiKey').value.trim();
      return v ? { 'X-API-Key': v } : {};
    };
    const getUrl = () => document.getElementById('serverUrl').value.replace(/\/$/, '');
    const getWsUrl = () => getUrl().replace(/^http/, 'ws');
    const logSys = (m) => { document.getElementById('sysLog').innerHTML = m; };

    // --- HUD MODULE (Taktis) ---
    // Persistent detections data
    let currentDetections = [];
    let hudRenderLoop = null;

    function startHUDRender() {
      if (hudRenderLoop) return;
      const render = () => {
        if (cameraActive) {
          const ctx = document.getElementById('overlayCanvas').getContext('2d');
          const w = document.getElementById('overlayCanvas').width;
          const h = document.getElementById('overlayCanvas').height;
          drawTacticalHUD(ctx, w, h, currentDetections);
        }
        hudRenderLoop = requestAnimationFrame(render);
      };
      render();
    }

    function drawTacticalHUD(ctx, width, height, dets) {
      if (!ctx) return;
      ctx.clearRect(0, 0, width, height);
      // Crosshair
      const cx = width / 2, cy = height / 2;
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)'; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(cx - 20, cy); ctx.lineTo(cx + 20, cy);
      ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy + 20); ctx.stroke();
      if (!dets || !dets.length) return;

      // Object List top-left
      ctx.fillStyle = 'rgba(22, 25, 34, 0.75)'; ctx.fillRect(10, 10, 200, dets.length * 20 + 10);
      dets.forEach((d, i) => {
        ctx.fillStyle = '#10b981'; ctx.font = '12px monospace';
        const conf = d.confidence ? d.confidence : (d.conf ? d.conf : 0);
        ctx.fillText(`[HIT] ${d.label.padEnd(10).substring(0, 10)} ${(conf * 100).toFixed(0)}%`, 18, 27 + i * 20);
      });

      // Boxes
      ctx.lineWidth = Math.max(2, width / 500);
      dets.forEach(d => {
        const box = d.bbox || d.box; if (!box) return;
        const [x1, y1, x2, y2] = box;
        ctx.strokeStyle = '#22d3ee';
        const L = 15; ctx.beginPath();
        ctx.moveTo(x1, y1 + L); ctx.lineTo(x1, y1); ctx.lineTo(x1 + L, y1);
        ctx.moveTo(x2 - L, y1); ctx.lineTo(x2, y1); ctx.lineTo(x2, y1 + L);
        ctx.moveTo(x2, y2 - L); ctx.lineTo(x2, y2); ctx.lineTo(x2 - L, y2);
        ctx.moveTo(x1 + L, y2); ctx.lineTo(x1, y2); ctx.lineTo(x1, y2 - L);
        ctx.stroke();
        const conf = d.confidence ? d.confidence : (d.conf ? d.conf : 0);
        ctx.fillStyle = '#22d3ee'; ctx.font = `bold ${Math.max(12, width / 60)}px monospace`;
        ctx.fillText(`${d.label} ${(conf * 100).toFixed(0)}%`, x1 + 5, Math.max(15, y1 - 5));
      });
    }

    // --- 1. CAPTURE & DETECT LOGIC ---
    let cameraActive = false, streamSource = null, facingMode = 'environment';
    let capPhotos = [];
    const video = document.getElementById('videoElement');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const toggleDet = document.getElementById('toggleDetect');
    const toggleRec = document.getElementById('toggleRecord');

    document.getElementById('startCamBtn').onclick = async () => {
      if (cameraActive) {
        if (streamSource) streamSource.getTracks().forEach(t => t.stop());
        cameraActive = false; video.srcObject = null;
        document.getElementById('startCamBtn').textContent = '▶ Nyalakan Kamera';
        document.getElementById('startCamBtn').className = 'btn btn-primary';
        document.getElementById('camStatus').textContent = 'Mati';
        document.getElementById('camStatus').className = 'badge bg-secondary';
        ['captureBtn', 'flipCamBtn', 'testLocBtn', 'toggleDetect', 'toggleRecord'].forEach(id => document.getElementById(id).disabled = true);
        return;
      }
      try {
        streamSource = await navigator.mediaDevices.getUserMedia({ video: { facingMode, width: { ideal: 1280 } } });
        video.srcObject = streamSource; cameraActive = true;
        document.getElementById('startCamBtn').textContent = '⏹ Matikan Kamera';
        document.getElementById('startCamBtn').className = 'btn btn-danger';
        document.getElementById('camStatus').textContent = 'LIVE';
        document.getElementById('camStatus').className = 'badge bg-success';
        ['captureBtn', 'flipCamBtn', 'testLocBtn', 'toggleDetect', 'toggleRecord'].forEach(id => document.getElementById(id).disabled = false);
        video.onloadedmetadata = () => {
          overlayCanvas.width = video.videoWidth;
          overlayCanvas.height = video.videoHeight;
          if (typeof startHUDRender === 'function') startHUDRender();
        };
      } catch (e) { logSys('Gagal akses kamera: ' + e.message); }
    };
    document.getElementById('flipCamBtn').onclick = () => { facingMode = facingMode === 'environment' ? 'user' : 'environment'; document.getElementById('startCamBtn').click(); setTimeout(() => document.getElementById('startCamBtn').click(), 200); };

    document.getElementById('captureBtn').onclick = () => {
      const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
      c.getContext('2d').drawImage(video, 0, 0);
      c.toBlob(blob => { capPhotos.push({ blob, url: URL.createObjectURL(blob) }); renderGallery(); }, 'image/jpeg');
    };

    function renderGallery() {
      document.getElementById('galCount').textContent = capPhotos.length;
      document.getElementById('galleryGrid').innerHTML = capPhotos.map((p, i) => `<div class="thumb"><img src="${p.url}"><button class="rm-btn" onclick="rmPhoto(${i})">X</button></div>`).join('');
      const canAct = capPhotos.length > 0;
      document.getElementById('uploadFilesBtn').disabled = !canAct;
      document.getElementById('downloadZipBtn').disabled = !canAct;
      document.getElementById('clearGalleryBtn').disabled = !canAct;
    }
    window.rmPhoto = (i) => { capPhotos.splice(i, 1); renderGallery(); };
    document.getElementById('clearGalleryBtn').onclick = () => { capPhotos = []; renderGallery(); };

    // Live Detect WS
    let detWs = null, detTimer = null;
    toggleDet.onchange = () => {
      if (!toggleDet.checked) { if (detWs) detWs.close(); if (detTimer) clearInterval(detTimer); currentDetections = []; logSys('Deteksi dihentikan.'); return; }
      detWs = new WebSocket(`${getWsUrl()}/ws/detect`);
      detWs.onopen = () => {
        logSys('🟢 Deteksi YOLO berjalan.');
        detTimer = setInterval(() => {
          if (detWs.readyState !== 1 || !cameraActive) return;
          const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext('2d').drawImage(video, 0, 0);
          c.toBlob(b => { if (detWs.readyState === 1 && b) detWs.send(b); }, 'image/jpeg', 0.6);
        }, 200);
      };
      detWs.onmessage = e => { try { const data = JSON.parse(e.data); if (data.detections) currentDetections = data.detections; } catch (e) { } };
      detWs.onclose = () => { toggleDet.checked = false; };
    };

    // Live Record WS
    let recWs = null, recTimer = null, recId = null;
    toggleRec.onchange = async () => {
      if (!toggleRec.checked) {
        if (recWs) { try { await fetch(`${getUrl()}/recordings/${recId}/stop`, { method: 'POST', headers: getHeaders() }); } catch (e) { } recWs.close(); }
        if (recTimer) clearInterval(recTimer);
        document.getElementById('recIndicator').style.display = 'none';
        logSys(`🔴 Rekaman disimpan. ID: ${recId} — Buka <a href="/replay?session=${recId}" style="color:#22d3ee;">/replay</a> untuk memutar ulang.`);
        return;
      }
      try {
        const r = await fetch(`${getUrl()}/recordings`, { method: 'POST', headers: getHeaders() });
        if (!r.ok) throw new Error('Gagal start record');
        const d = await r.json(); recId = d.session_id;

        recWs = new WebSocket(`${getWsUrl()}/ws/recordings/${recId}`);
        recWs.onopen = () => {
          document.getElementById('recIndicator').style.display = 'block'; let fn = 0;
          recTimer = setInterval(() => {
            const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext('2d').drawImage(video, 0, 0);
            c.toBlob(b => { if (recWs.readyState === 1 && b) { recWs.send(b); fn++; document.getElementById('recFrameCount').textContent = fn; } }, 'image/jpeg', 0.7);
          }, 200);
        };
        recWs.onmessage = e => { try { const data = JSON.parse(e.data); if (data.detections) currentDetections = data.detections; } catch (e) { } };
      } catch (e) { logSys(e.message); toggleRec.checked = false; }
    }

    // Tes Localize
    document.getElementById('testLocBtn').onclick = async () => {
      document.getElementById('localizeResArea').innerHTML = '<div class="text-info text-center p-3">Memproses...</div>';
      const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext('2d').drawImage(video, 0, 0);
      c.toBlob(async blob => {
        const fd = new FormData(); fd.append('image', blob, 't.jpg');
        try {
          const r = await fetch(`${getUrl()}/relocalize`, { method: 'POST', headers: getHeaders(), body: fd });
          const d = await r.json();
          if (d.success) {
            const pos = d.position || [0, 0, 0], rot = d.rotation || [0, 0, 0];
            document.getElementById('localizeResArea').innerHTML = `
              <div class="row g-2 text-center small text-light">
                <div class="col-6"><div class="p-2 border border-secondary rounded">Stat: <b class="text-success">OK</b></div></div>
                <div class="col-6"><div class="p-2 border border-secondary rounded">Inliers: <b class="text-info">${d.n_inliers}</b></div></div>
                <div class="col-12"><div class="p-2 border border-secondary rounded text-start">Posisi (X,Y,Z): <strong class="text-white">${pos.map(x => x.toFixed(3)).join(', ')}</strong></div></div>
                <div class="col-12"><div class="p-2 border border-secondary rounded text-start">Rotasi (R,P,Y): <strong class="text-white">${rot.map(x => x.toFixed(3)).join(', ')}</strong></div></div>
              </div>`;
          } else document.getElementById('localizeResArea').innerHTML = '<div class="text-danger p-2 text-center">❌ Gagal VPS.</div>';
        } catch (e) { document.getElementById('localizeResArea').innerHTML = '<div class="text-danger p-2 text-center">❌ Gagal Koneksi Server.</div>'; }
      }, 'image/jpeg');
    }
  </script>
</body>

</html>
