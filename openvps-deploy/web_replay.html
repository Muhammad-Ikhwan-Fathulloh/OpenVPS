<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OpenVPS — AR Replay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090d;
      --panel: #161922;
      --border: #232839;
      --accent: #06b6d4;
      --accent2: #22d3ee;
      --accent-glow: rgba(6, 182, 212, 0.15);
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.1);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.1);
      --yellow: #f59e0b;
      --yellow-bg: rgba(245, 158, 11, 0.08);
      --text: #f1f5f9;
      --text2: #94a3b8;
      --text3: #64748b;
      --purple: #a78bfa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, #0f1117, var(--panel));
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    .logo h1 {
      font-size: 1rem;
      font-weight: 700;
    }

    .logo span {
      color: var(--accent2);
    }

    .header-badge {
      font-size: 0.68rem;
      background: var(--accent-glow);
      color: var(--accent2);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    /* ===== LAYOUT ===== */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    label.fl {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    select {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: var(--accent);
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #0e9dc0);
      color: #fff;
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.2);
    }

    .btn-ghost {
      background: var(--panel);
      color: var(--text2);
      border: 1px solid var(--border);
    }

    /* ===== AR STAGE ===== */
    .ar-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16/10;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .ar-stage:active {
      cursor: grabbing;
    }

    .ar-stage canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* HUD overlays */
    .hud {
      position: absolute;
      z-index: 20;
      pointer-events: none;
    }

    .hud-tl {
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-tr {
      top: 14px;
      right: 14px;
      text-align: right;
    }

    .hud-bl {
      bottom: 14px;
      left: 14px;
    }

    .hud-br {
      bottom: 14px;
      right: 14px;
    }

    .hud-pill {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent2);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .hud-pill.green {
      color: var(--green);
    }

    .hud-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    /* ===== SCRUBBER / TIMELINE ===== */
    .timeline-bar {
      margin-top: 12px;
      padding: 0 4px;
    }

    .scrubber-wrap {
      position: relative;
      height: 40px;
      display: flex;
      align-items: center;
    }

    input[type="range"].scrubber {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
      cursor: grab;
    }

    input[type="range"].scrubber::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent2);
      border: none;
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
    }

    .timeline-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .timeline-controls .left,
    .timeline-controls .right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .frame-label {
      font-size: 0.78rem;
      color: var(--text2);
      font-weight: 500;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* ===== DETECTION LIST ===== */
    .det-panel {
      margin-top: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      max-height: 200px;
      overflow-y: auto;
    }

    .det-panel h3 {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .det-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--accent-glow);
      color: var(--accent2);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      margin: 2px;
    }

    /* ===== SESSION LIST ===== */
    .session-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
    }

    .session-panel h3 {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .session-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
      margin-bottom: 6px;
      font-size: 0.82rem;
      transition: border-color 0.2s;
    }

    .session-row:hover {
      border-color: var(--accent);
    }

    .session-row .meta {
      color: var(--text3);
      font-size: 0.72rem;
    }

    .toast {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 500;
      display: none;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-4px)
      }

      to {
        opacity: 1
      }
    }

    .toast.info {
      display: block;
      background: var(--yellow-bg);
      color: var(--yellow);
    }

    .toast.ok {
      display: block;
      background: var(--green-bg);
      color: var(--green);
    }

    .toast.err {
      display: block;
      background: var(--red-bg);
      color: var(--red);
    }

    /* Swipe hint */
    .swipe-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      color: var(--text2);
      font-size: 0.85rem;
      text-align: center;
      pointer-events: none;
      opacity: 0.7;
    }

    .swipe-hint .arrows {
      font-size: 2rem;
      margin-bottom: 6px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">V</div>
        <div>
          <h1>Open<span>VPS</span> Replay</h1>
        </div>
      </div>
      <div class="header-badge">🎬 AR Replay Mode</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOP CONFIG BAR -->
    <div class="top-bar">
      <div>
        <label class="fl">Server</label>
        <input type="text" id="serverUrl" value="http://localhost:8000" style="width: 260px;">
      </div>
      <div>
        <label class="fl">API Key</label>
        <input type="text" id="apiKey" placeholder="Opsional" style="width: 160px;">
      </div>
      <div>
        <label class="fl">Session ID</label>
        <input type="text" id="sessionId" placeholder="Kosong = daftar semua" style="width: 200px;">
      </div>
      <button class="btn btn-primary" id="loadBtn">📂 Muat</button>
      <button class="btn btn-ghost" id="listBtn">📋 Daftar Sesi</button>
    </div>

    <div id="statusToast" class="toast"></div>

    <!-- SESSION LIST (hidden by default) -->
    <div id="sessionPanel" class="session-panel" style="display:none;">
      <h3>Sesi Tersedia</h3>
      <div id="sessionList"></div>
    </div>

    <!-- AR STAGE -->
    <div class="ar-stage" id="arStage">
      <canvas id="stageCanvas"></canvas>

      <!-- HUD Overlays -->
      <div class="hud hud-tl">
        <div class="hud-pill green">
          <div class="dot"></div> REPLAY
        </div>
      </div>
      <div class="hud hud-tr">
        <div class="hud-pill" id="hudFrame">Frame 0 / 0</div>
      </div>
      <div class="hud hud-bl">
        <div class="hud-pill" id="hudObjects">0 objek</div>
      </div>
      <div class="hud hud-br">
        <div class="hud-pill" id="hudSpeed">1x</div>
      </div>

      <!-- Swipe hint (shown when no session loaded) -->
      <div class="swipe-hint" id="swipeHint">
        <div class="arrows">👆 ← →</div>
        <p>Geser/drag untuk berpindah frame<br>atau gunakan slider di bawah</p>
      </div>
    </div>

    <!-- TIMELINE / SCRUBBER -->
    <div class="timeline-bar">
      <div class="scrubber-wrap">
        <input type="range" class="scrubber" id="scrubber" min="0" max="0" value="0">
      </div>
      <div class="timeline-controls">
        <div class="left">
          <button class="btn btn-ghost" id="prevBtn" disabled>⏮</button>
          <button class="btn btn-primary" id="playBtn" disabled>▶ Play</button>
          <button class="btn btn-ghost" id="nextBtn" disabled>⏭</button>
        </div>
        <div class="right">
          <span class="frame-label" id="frameLabel">0 / 0</span>
          <select id="speedSelect" style="width: 70px;">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
        </div>
      </div>
    </div>

    <!-- DETECTION PANEL -->
    <div class="det-panel" id="detPanel" style="display:none;">
      <h3>🎯 Objek Terdeteksi</h3>
      <div id="detChips"></div>
    </div>
  </div>

  <script>
    // ============================================================
    // DOM
    // ============================================================
    const serverUrlInput = document.getElementById('serverUrl');
    const apiKeyInput = document.getElementById('apiKey');
    const sessionIdInput = document.getElementById('sessionId');
    const statusToast = document.getElementById('statusToast');
    const sessionPanel = document.getElementById('sessionPanel');
    const sessionList = document.getElementById('sessionList');
    const arStage = document.getElementById('arStage');
    const stageCanvas = document.getElementById('stageCanvas');
    const scrubber = document.getElementById('scrubber');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const frameLabel = document.getElementById('frameLabel');
    const speedSelect = document.getElementById('speedSelect');
    const hudFrame = document.getElementById('hudFrame');
    const hudObjects = document.getElementById('hudObjects');
    const hudSpeed = document.getElementById('hudSpeed');
    const swipeHint = document.getElementById('swipeHint');
    const detPanel = document.getElementById('detPanel');
    const detChips = document.getElementById('detChips');
    const ctx = stageCanvas.getContext('2d');

    let manifest = null;
    let frameCache = new Map();
    let lastDetections = null;
    let currentIdx = 0;
    let playing = false;
    let playTimer = null;

    // ============================================================
    // HELPERS
    // ============================================================
    function toast(msg, type) { statusToast.className = `toast ${type}`; statusToast.textContent = msg; }
    function getHeaders() { const k = apiKeyInput.value.trim(); return k ? { 'X-API-Key': k } : {}; }
    function baseUrl() { return serverUrlInput.value.replace(/\/$/, ''); }

    // Read session from URL query
    const params = new URLSearchParams(window.location.search);
    if (params.get('session')) sessionIdInput.value = params.get('session');
    if (params.get('server')) serverUrlInput.value = params.get('server');

    // ============================================================
    // SESSION LIST
    // ============================================================
    async function listSessions() {
      try {
        toast('Memuat daftar sesi...', 'info');
        const res = await fetch(`${baseUrl()}/recordings`, { headers: getHeaders() });
        const data = await res.json();
        const sessions = data.sessions || data;
        sessionPanel.style.display = 'block';
        sessionList.innerHTML = '';
        if (!sessions.length) { sessionList.innerHTML = '<div style="color:var(--text3);font-size:0.8rem;">Belum ada sesi.</div>'; return; }
        sessions.forEach(s => {
          const row = document.createElement('div');
          row.className = 'session-row';
          row.innerHTML = `<span>${s.session_id}</span><span class="meta">${s.n_frames || '?'} frame</span>`;
          row.addEventListener('click', () => {
            sessionIdInput.value = s.session_id;
            loadSession();
          });
          sessionList.appendChild(row);
        });
        toast(`📋 ${sessions.length} sesi ditemukan`, 'ok');
      } catch (e) {
        toast('❌ ' + e.message, 'err');
      }
    }

    // ============================================================
    // LOAD SESSION
    // ============================================================
    async function loadSession() {
      const sid = sessionIdInput.value.trim();
      if (!sid) { toast('Masukkan Session ID atau pilih dari daftar.', 'err'); return; }
      try {
        toast('Memuat manifest...', 'info');
        const res = await fetch(`${baseUrl()}/recordings/${sid}/manifest`, { headers: getHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        manifest = await res.json();
        frameCache.clear();
        currentIdx = 0; lastDetections = null;

        const total = manifest.frames.length;
        scrubber.max = total - 1; scrubber.value = 0;
        playBtn.disabled = false; prevBtn.disabled = false; nextBtn.disabled = false;
        swipeHint.style.display = 'none';
        sessionPanel.style.display = 'none';

        toast(`✅ Sesi dimuat: ${total} frame`, 'ok');
        preload(0, 10);
        showFrame(0);
      } catch (e) {
        toast('❌ ' + e.message, 'err');
      }
    }

    // ============================================================
    // FRAME LOADING & DISPLAY
    // ============================================================
    function fetchFrameImage(idx) {
      if (frameCache.has(idx)) return Promise.resolve(frameCache.get(idx));
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const f = manifest.frames[idx];
        img.src = `${baseUrl()}/recordings/${manifest.session_id}/frames/${f.file}`;
        img.onload = () => { frameCache.set(idx, img); resolve(img); };
        img.onerror = reject;
      });
    }

    function preload(startIdx, count) {
      for (let i = startIdx; i < Math.min(startIdx + count, manifest.frames.length); i++) {
        fetchFrameImage(i).catch(() => { });
      }
    }

    async function showFrame(idx) {
      if (!manifest || idx < 0 || idx >= manifest.frames.length) return;
      currentIdx = idx;
      const total = manifest.frames.length;

      // Update UI labels
      scrubber.value = idx;
      const label = `${idx + 1} / ${total}`;
      frameLabel.textContent = label;
      hudFrame.textContent = `Frame ${label}`;

      // Draw frame
      try {
        const img = await fetchFrameImage(idx);
        stageCanvas.width = img.naturalWidth;
        stageCanvas.height = img.naturalHeight;
        ctx.drawImage(img, 0, 0);

        // Draw detections
        const frameData = manifest.frames[idx];
        let dets = frameData.detections;
        if (dets && dets.length > 0) {
          lastDetections = dets;
        } else if (lastDetections) {
          dets = lastDetections; // hold previous detections
        }

        if (dets && dets.length > 0) {
          drawDetections(dets);
          renderDetChips(dets);
          hudObjects.textContent = `${dets.length} objek`;
        } else {
          hudObjects.textContent = '0 objek';
          detPanel.style.display = 'none';
        }
      } catch {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, stageCanvas.width || 640, stageCanvas.height || 480);
        ctx.fillStyle = '#ef4444';
        ctx.font = '16px Inter, sans-serif';
        ctx.fillText('Gagal memuat frame', 20, 40);
      }

      preload(idx + 1, 5);
    }

    function drawDetections(dets) {
      dets.forEach(d => {
        const [x1, y1, x2, y2] = d.bbox;
        // Bounding box
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = Math.max(2, stageCanvas.width / 400);
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

        // Label background
        const label = `${d.label} ${(d.confidence * 100).toFixed(0)}%`;
        ctx.font = `bold ${Math.max(12, stageCanvas.width / 60)}px Inter, sans-serif`;
        const tw = ctx.measureText(label).width;
        const lh = Math.max(18, stageCanvas.width / 40);
        ctx.fillStyle = 'rgba(6,182,212,0.75)';
        ctx.fillRect(x1, y1 - lh, tw + 12, lh);
        ctx.fillStyle = '#fff';
        ctx.fillText(label, x1 + 6, y1 - 4);
      });
    }

    function renderDetChips(dets) {
      detPanel.style.display = 'block';
      detChips.innerHTML = dets.map(d =>
        `<span class="det-chip">${d.label} ${(d.confidence * 100).toFixed(0)}%</span>`
      ).join('');
    }

    // ============================================================
    // PLAYBACK
    // ============================================================
    function stopPlayback() {
      playing = false; playBtn.textContent = '▶ Play';
      if (playTimer) { clearTimeout(playTimer); playTimer = null; }
    }

    function startPlayback() {
      if (!manifest) return;
      playing = true; playBtn.textContent = '⏸ Pause';
      scheduleNext();
    }

    function scheduleNext() {
      if (!playing || !manifest) return;
      const speed = parseFloat(speedSelect.value) || 1;
      hudSpeed.textContent = `${speed}x`;
      const delay = (manifest.frame_interval_ms || 200) / speed;
      playTimer = setTimeout(() => {
        const next = currentIdx + 1;
        if (next >= manifest.frames.length) { stopPlayback(); return; }
        showFrame(next);
        scheduleNext();
      }, delay);
    }

    // ============================================================
    // TOUCH / DRAG SCRUBBING (AR-like "geser geser")
    // ============================================================
    let isDragging = false;
    let dragStartX = 0;
    let dragStartIdx = 0;

    arStage.addEventListener('pointerdown', (e) => {
      if (!manifest) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartIdx = currentIdx;
      arStage.setPointerCapture(e.pointerId);
      stopPlayback();
    });

    arStage.addEventListener('pointermove', (e) => {
      if (!isDragging || !manifest) return;
      const dx = e.clientX - dragStartX;
      const stageW = arStage.offsetWidth;
      const total = manifest.frames.length;
      // Map drag distance to frame count: full width = all frames
      const frameDelta = Math.round((dx / stageW) * total * 0.5);
      let newIdx = dragStartIdx - frameDelta; // drag right = go back (like scrolling)
      newIdx = Math.max(0, Math.min(total - 1, newIdx));
      if (newIdx !== currentIdx) showFrame(newIdx);
    });

    arStage.addEventListener('pointerup', () => { isDragging = false; });
    arStage.addEventListener('pointercancel', () => { isDragging = false; });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (!manifest) return;
      if (e.key === 'ArrowRight') { stopPlayback(); showFrame(Math.min(currentIdx + 1, manifest.frames.length - 1)); }
      if (e.key === 'ArrowLeft') { stopPlayback(); showFrame(Math.max(currentIdx - 1, 0)); }
      if (e.key === ' ') { e.preventDefault(); playing ? stopPlayback() : startPlayback(); }
    });

    // ============================================================
    // EVENT LISTENERS
    // ============================================================
    document.getElementById('loadBtn').addEventListener('click', loadSession);
    document.getElementById('listBtn').addEventListener('click', listSessions);
    scrubber.addEventListener('input', () => { stopPlayback(); showFrame(parseInt(scrubber.value)); });
    prevBtn.addEventListener('click', () => { stopPlayback(); showFrame(Math.max(currentIdx - 1, 0)); });
    nextBtn.addEventListener('click', () => { if (manifest) { stopPlayback(); showFrame(Math.min(currentIdx + 1, manifest.frames.length - 1)); } });
    playBtn.addEventListener('click', () => { playing ? stopPlayback() : startPlayback(); });
    speedSelect.addEventListener('change', () => { hudSpeed.textContent = speedSelect.value + 'x'; });

    // Auto-load
    if (sessionIdInput.value) loadSession();
  </script>
</body>

</html>
