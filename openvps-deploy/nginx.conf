# ============================================================
#  OpenVPS — Nginx Production Reverse Proxy
#  Domain: openvps.darting.my.id
#  Letakkan file ini di: /etc/nginx/sites-available/openvps
#  Lalu: ln -s /etc/nginx/sites-available/openvps /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
# ============================================================

# ---------- Upstream backend (FastAPI/uvicorn container) ----------
# Jika pakai docker: gunakan 127.0.0.1:8000 (port container di-publish ke host)
# Jika pakai systemd di host: sama saja 127.0.0.1:8000
upstream openvps_backend {
    server 127.0.0.1:8000;
    keepalive 64;                 # koneksi TCP reuse -> lebih cepat
}

# ---------- HTTP -> HTTPS redirect (seluruh trafik dipaksa TLS) ----------
server {
    listen 80;
    listen [::]:80;
    server_name openvps.darting.my.id;

    # Allow Let's Encrypt /.well-known/acme-challenge/ lewat HTTP
    location ~ /\.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

# ---------- HTTPS main server ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openvps.darting.my.id;

    # ----- SSL/TLS (certbot / Let's Encrypt) -----
    # Jalankan: certbot --nginx -d openvps.darting.my.id
    # Atau isi manual path cert di bawah:
    ssl_certificate     /etc/letsencrypt/live/openvps.darting.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvps.darting.my.id/privkey.pem;

    # Modern TLS config (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ----- Security headers -----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;
    add_header Permissions-Policy "camera=self, microphone=self";
    # NOTE: webcam getUserMedia() HANYA BISA di HTTPS atau localhost, jadi HSTS di atas WAJIB.

    # ----- Max upload -----
    client_max_body_size 64M;
    client_body_buffer_size 2M;

    # ----- Access log (matikan untuk hemat IO di VPS kecil) -----
    access_log /var/log/nginx/openvps.access.log;
    error_log  /var/log/nginx/openvps.error.log warn;

    # =====================================================================
    #  ROUTE: Static recordings frames (image/jpeg) — cache aggressive
    # =====================================================================
    # Gunakan ini JIKA recordings folder di-mount ke /var/www/openvps/recordings
    # Contoh mount: ln -s /path/app/recordings /var/www/openvps/recordings
    # Jika tidak pakai, hapus block ini — biar FastAPI yang serve (lebih lambat tapi simple).
    #
    # location /recordings/ {
    #     alias /var/www/openvps/recordings/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    #     types { image/jpeg jpg jpeg; }
    #     default_type image/jpeg;
    #     try_files $uri @backend;   # fall back ke FastAPI kalau not found / butuh auth
    # }

    # =====================================================================
    #  ROUTE: WebSocket — CRITICAL untuk /ws/detect & /ws/recordings/*
    # =====================================================================
    # Ini yang PALING sering salah di konfigurasi default nginx:
    #   proxy_read_timeout default = 60s  -> WS ke-drop tiap 1 menit idle
    #   Upgrade header tidak di-set     -> WS gagal handshake
    location /ws/ {
        proxy_pass http://openvps_backend;
        proxy_http_version 1.1;

        # WebSocket handshake headers (WAJIB)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tanpa ini, WS PUTUS setelah 60 detik tidak ada traffic!
        # Kita set 2 jam — detection sesi panjang tidak ke-drop.
        proxy_read_timeout  7200s;
        proxy_send_timeout  7200s;
        proxy_connect_timeout 60s;

        # Buffer OFF untuk streaming frame realtime (rendahkan latency)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # =====================================================================
    #  ROUTE: Everything else — reverse proxy ke FastAPI
    # =====================================================================
    location / {
        proxy_pass http://openvps_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout untuk YOLO inference pertama (cold start + bisa 30-90 detik)
        proxy_read_timeout  300s;   # 5 menit — aman untuk inference lambat CPU
        proxy_send_timeout  300s;
        proxy_connect_timeout 60s;

        # Buffer ON untuk halaman HTML/JSON (lebih hemat CPU uvicorn)
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # Cache HEADERS untuk static assets HTML (boleh cache sebentar — kita pakai auto-fill JS inline)
        # JANGAN cache endpoint API /relocalize, /recordings, dll — FastAPI manage sendiri
        if ($request_uri ~* "\.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$") {
            expires 7d;
            add_header Cache-Control "public";
        }

        # Handle 502/504 sewaktu uvicorn restart (YOLO loading) — tampilkan friendly page
        error_page 502 503 504 = @loading;
    }

    # =====================================================================
    #  FRIENDLY LOADING PAGE (502 saat uvicorn startup load YOLO)
    # =====================================================================
    location @loading {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenVPS — Memulai...</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",sans-serif;background:#08090d;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:480px;background:#161922;border:1px solid #232839;border-radius:16px;padding:36px 32px;text-align:center}
  .logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#06b6d4,#a78bfa);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;font-weight:800;color:#fff}
  h1{font-size:1.4rem;margin-bottom:8px;color:#f1f5f9}
  p{color:#94a3b8;font-size:.9rem;margin-bottom:20px;line-height:1.6}
  .bar{width:100%;height:8px;background:#232839;border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar-fill{height:100%;width:10%;background:linear-gradient(90deg,#06b6d4,#a78bfa);border-radius:99px;animation:load 3s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(1000%)}}
  .tip{font-size:.75rem;color:#64748b;margin-top:16px}
  .retry{margin-top:20px;background:linear-gradient(135deg,#06b6d4,#0e9dc0);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit}
</style>
</head>
<body><div class="card">
  <div class="logo">V</div>
  <h1>OpenVPS sedang memulai...</h1>
  <p>Server sedang memuat model YOLO dan peta VPS. Ini bisa memakan waktu 30-120 detik tergantung kecepatan VPS.</p>
  <div class="bar"><div class="bar-fill"></div></div>
  <p style="margin-bottom:4px;">Mohon tunggu, halaman akan otomatis refresh.</p>
  <button class="retry" onclick="location.reload()">Refresh Sekarang</button>
  <div class="tip">Jika halaman ini muncul terus-menerus >3 menit, cek log server/container.</div>
</div>
<script>setTimeout(function(){location.reload()},10000);</script>
</body></html>';
    }
}
